<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading — The Epilogue Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://drive.google.com" crossorigin>
<link rel="preconnect" href="https://api.jsonbin.io" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Noto+Serif+Bengali:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Dancing+Script:wght@500;600;700&family=Caveat:wght@500;600;700&family=Atma:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0c09;--bg-2:#16110c;--paper:#f2e8d5;--paper-2:#e2d5b8;--ink:#1c1610;--ink-soft:#6e5f4a;--ink-mute:#a08c6f;--gold:#c9a86a;--gold-bright:#e4c084;--gold-soft:rgba(201,168,106,.4);--line:rgba(201,168,106,.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cormorant Garamond','Noto Serif Bengali',Georgia,serif;background:var(--bg);color:var(--paper);display:flex;flex-direction:column;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,rgba(255,220,180,.012) 0,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 4px,rgba(0,0,0,.02) 5px),radial-gradient(ellipse at 50% -20%,rgba(201,168,106,.14) 0,transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(139,40,40,.1) 0,transparent 60%),linear-gradient(180deg,#0f0c09 0,#17110c 50%,#0f0c09 100%);pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%);pointer-events:none}

/* ===== TOP BAR ===== */
.topbar{flex-shrink:0;position:relative;z-index:3;display:flex;align-items:center;gap:18px;padding:14px 26px;background:linear-gradient(180deg,rgba(30,22,14,.95),rgba(15,12,9,.98));border-bottom:1px solid var(--line);box-shadow:0 4px 20px -6px rgba(0,0,0,.8)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,106,.5) 20%,rgba(228,192,132,.7) 50%,rgba(201,168,106,.5) 80%,transparent)}
.back{display:inline-flex;align-items:center;gap:9px;color:var(--gold-bright);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.32em;text-transform:uppercase;padding:9px 16px;border:1px solid var(--gold-soft);background:rgba(20,14,8,.5);transition:all .3s ease;white-space:nowrap;flex-shrink:0}
.back::before{content:"←";font-size:.85rem;transition:transform .3s ease}
.back:hover{background:rgba(201,168,106,.12);border-color:var(--gold);letter-spacing:.38em}
.back:hover::before{transform:translateX(-3px)}
.title-block{flex:1;min-width:0;text-align:center;padding:0 12px}
.title-block .t{font-family:'Cormorant Garamond','Noto Serif Bengali',serif;font-style:italic;font-weight:500;font-size:1.15rem;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-shadow:0 0 24px rgba(201,168,106,.15)}
.title-block .a{display:block;margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:8px;flex-shrink:0}
.ib{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:rgba(20,14,8,.5);border:1px solid var(--gold-soft);color:var(--gold-bright);cursor:pointer;font-family:inherit;font-size:.95rem;text-decoration:none;transition:all .25s ease;line-height:1}
.ib:hover{background:rgba(201,168,106,.15);border-color:var(--gold);color:var(--paper);box-shadow:0 0 20px rgba(201,168,106,.2)}
.progress-bar{position:absolute;bottom:-1px;left:0;height:2px;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));box-shadow:0 0 12px rgba(201,168,106,.6);z-index:10;transition:width .1s linear;pointer-events:none}

/* ===== STAGE ===== */
.stage{flex:1;min-height:0;padding:22px;display:flex;align-items:center;justify-content:center;position:relative}
.frame{position:relative;width:100%;max-width:1250px;height:100%;background:var(--paper);padding:8px;border-radius:2px;box-shadow:inset 14px 0 24px -18px rgba(0,0,0,.5),inset -8px 0 16px -14px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5) inset,0 20px 44px -18px rgba(0,0,0,.85),0 0 0 1px rgba(201,168,106,.15),0 0 60px rgba(201,168,106,.08);animation:fadeIn .55s ease both}
.frame::before{content:"";position:absolute;inset:14px;border:1px solid rgba(184,137,75,.35);pointer-events:none;z-index:2}
.frame::after{content:"";position:absolute;inset:18px;border:1px solid rgba(184,137,75,.14);pointer-events:none;z-index:2}
.corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--gold);opacity:.55;pointer-events:none;z-index:3}
.corner.tl{top:22px;left:22px;border-right:none;border-bottom:none}
.corner.tr{top:22px;right:22px;border-left:none;border-bottom:none}
.corner.bl{bottom:22px;left:22px;border-right:none;border-top:none}
.corner.br{bottom:22px;right:22px;border-left:none;border-top:none}
iframe{width:100%;height:100%;border:none;background:var(--paper);display:block;position:relative;z-index:1;border-radius:1px}

/* ===== LOADING ===== */
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--paper);z-index:5;transition:opacity .45s ease}
.loading.out{opacity:0;pointer-events:none}
.sk-book{width:64px;height:88px;background:linear-gradient(90deg,rgba(201,168,106,.08) 0,rgba(201,168,106,.22) 50%,rgba(201,168,106,.08) 100%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:2px 4px 4px 2px;box-shadow:inset 6px 0 12px -6px rgba(0,0,0,.5),0 8px 20px -8px rgba(0,0,0,.4);position:relative}
.sk-book::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,168,106,.25)}
.loading-msg{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-soft);opacity:.85}

/* ===== ERROR ===== */
.err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--paper);z-index:6;text-align:center;padding:36px}
.err.on{display:flex}
.err .mark{font-size:2rem;color:var(--gold);opacity:.85}
.err h2{font-family:'Cormorant Garamond','Noto Serif Bengali',serif;font-style:italic;font-weight:500;font-size:1.45rem;color:var(--ink);line-height:1.2}
.err p{font-size:1rem;font-style:italic;color:var(--ink-soft);max-width:420px;line-height:1.55}
.err a{margin-top:10px;display:inline-flex;align-items:center;gap:10px;padding:11px 24px;border:1px solid var(--gold);color:var(--ink);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;transition:all .28s ease}
.err a:hover{background:var(--gold);color:var(--paper);letter-spacing:.4em}

/* ===== TEXT READER ===== */
.text-reader{position:absolute;inset:0;background:var(--paper);overflow-y:auto;z-index:1;padding:0;scroll-behavior:smooth}
.text-reader::-webkit-scrollbar{width:8px}
.text-reader::-webkit-scrollbar-thumb{background:rgba(184,137,75,.4);border-radius:4px}

.book-page{max-width:720px;margin:0 auto;padding:80px 44px 110px;color:var(--ink);font-family:'Cormorant Garamond','Noto Serif Bengali',Georgia,serif;font-size:1.18rem;line-height:1.95;position:relative}

.page-header{text-align:center;margin-bottom:64px;padding-bottom:44px;border-bottom:1px solid rgba(184,137,75,.3)}
.page-header .orn{font-size:.85rem;color:var(--gold);letter-spacing:.5em;margin-bottom:22px}
.page-header h1{font-family:'Cormorant Garamond','Noto Serif Bengali',serif;font-weight:500;font-style:italic;font-size:clamp(2.1rem,5vw,3.2rem);line-height:1.14;color:var(--ink);letter-spacing:-.005em;margin-bottom:16px}
.page-header .sub{font-style:italic;font-weight:300;font-size:1.02rem;color:var(--ink-soft);margin-bottom:18px;letter-spacing:.02em}
.page-header .byline{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.page-header .hr{width:60px;height:1px;background:var(--gold);margin:28px auto 0;opacity:.6}

.page-content p{margin-bottom:1.5em;text-align:left;text-indent:0;line-height:1.95;word-break:normal;overflow-wrap:break-word;hyphens:none;-webkit-hyphens:none}
.page-content .h1{font-family:'Cormorant Garamond','Noto Serif Bengali',serif;font-weight:600;font-style:italic;font-size:1.65rem;color:var(--ink);margin:2.4em 0 .9em;text-align:center;text-indent:0;line-height:1.3}
.page-content .h2{font-family:'Cormorant Garamond','Noto Serif Bengali',serif;font-weight:600;font-size:1.22rem;color:var(--ink);margin:2em 0 .7em;text-indent:0;letter-spacing:.01em;line-height:1.4}
.page-content .divider{text-align:center;color:var(--gold);letter-spacing:.9em;margin:2.8em 0;font-size:.8rem;opacity:.75}
.page-content blockquote{margin:2em 0;padding:1.1em 1.5em;border-left:3px solid var(--gold);background:rgba(201,168,106,.06);font-style:italic;color:var(--ink-soft);text-indent:0;line-height:1.9;border-radius:0 4px 4px 0}
.page-content .poem{text-indent:0;text-align:center;font-style:italic;line-height:2.15;margin:2em 0;color:var(--ink-soft);font-size:1.12rem}

.page-footer{text-align:center;margin-top:90px;padding-top:44px;border-top:1px solid rgba(184,137,75,.25)}
.page-footer .orn{font-size:1.05rem;color:var(--gold);margin-bottom:12px}
.page-footer p{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);opacity:.7}

/* ===== QUOTE ===== */
.book-page[data-cat="quote"] .page-content{display:flex;flex-direction:column;gap:2.4em;margin-top:1em}
.book-page[data-cat="quote"] .page-content p{text-align:center;font-style:italic;font-size:1.3rem;line-height:1.75;color:var(--ink);padding:0 20px;margin:0}
.book-page[data-cat="quote"] .quote-card{position:relative;text-align:center;padding:30px 44px;background:rgba(201,168,106,.05);border-top:1px solid rgba(184,137,75,.25);border-bottom:1px solid rgba(184,137,75,.25)}
.book-page[data-cat="quote"] .quote-card .qmark{position:absolute;font-family:Georgia,serif;font-size:3.6rem;line-height:1;color:var(--gold);opacity:.4;pointer-events:none}
.book-page[data-cat="quote"] .quote-card .qmark.open{top:-8px;left:10px}
.book-page[data-cat="quote"] .quote-card .qmark.close{bottom:-34px;right:10px}
.book-page[data-cat="quote"] .quote-card .qtext{font-family:'Cormorant Garamond','Noto Serif Bengali',serif;font-style:italic;font-size:1.42rem;line-height:1.7;color:var(--ink);margin:0}
.book-page[data-cat="quote"] .page-content blockquote{text-align:center;border:none;background:rgba(201,168,106,.08);padding:22px 30px;font-size:1.35rem;border-radius:4px;margin:0}

/* ===== POETRY ===== */
.book-page[data-cat="poetry"] .page-content{font-size:1.2rem}
.book-page[data-cat="poetry"] .page-content p{text-align:center;font-style:italic;line-height:2.25;color:var(--ink);margin-bottom:2.2em;letter-spacing:.01em}
.book-page[data-cat="poetry"] .page-content .poem{line-height:2.3;margin:2.4em 0;font-size:1.2rem}
.book-page[data-cat="poetry"] .page-content .h1{font-size:1.5rem;margin:2.6em 0 1em;letter-spacing:.02em}
.book-page[data-cat="poetry"] .page-content .h2{font-size:1.15rem;text-align:center;font-style:italic;margin:2.2em 0 1em}
.book-page[data-cat="poetry"] .page-content blockquote{text-align:center;border:none;border-top:1px solid rgba(184,137,75,.3);border-bottom:1px solid rgba(184,137,75,.3);background:transparent;padding:1.3em 2em;font-size:1.15rem;border-radius:0}

/* ===== STORY ===== */
.book-page[data-cat="story"] .page-content p{font-size:1.18rem;line-height:1.95}
.book-page[data-cat="story"] .page-content blockquote{font-size:1.15rem;padding-left:1.6em}

/* ===== ESSAY ===== */
.book-page[data-cat="essay"] .page-content p{font-size:1.15rem;line-height:1.85;margin-bottom:1.4em}
.book-page[data-cat="essay"] .page-content .h1{text-align:left;font-size:1.7rem;letter-spacing:-.005em;margin:2.2em 0 .6em}
.book-page[data-cat="essay"] .page-content .h2{font-size:1.22rem;margin:1.9em 0 .5em}
.book-page[data-cat="essay"] .page-content blockquote{background:transparent;border-left:2px solid var(--gold);padding-left:1.3em;font-size:1.1rem}

/* =========================================================
   LETTER — aged paper + postmark + bilingual signature
   ========================================================= */
.book-page[data-cat="letter"]{
  background:
    radial-gradient(circle at 22% 12%, rgba(80,50,25,.16) 0%, transparent 0.6%),
    radial-gradient(circle at 82% 38%, rgba(80,50,25,.12) 0%, transparent 0.5%),
    radial-gradient(circle at 14% 62%, rgba(80,50,25,.1) 0%, transparent 0.7%),
    radial-gradient(circle at 71% 82%, rgba(80,50,25,.09) 0%, transparent 0.5%),
    radial-gradient(circle at 45% 26%, rgba(80,50,25,.08) 0%, transparent 0.4%),
    radial-gradient(ellipse at 12% 20%, rgba(139,90,45,.12) 0%, transparent 35%),
    radial-gradient(ellipse at 88% 78%, rgba(139,90,45,.1) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 55%, rgba(160,110,60,.06) 0%, transparent 60%),
    repeating-linear-gradient(0deg, rgba(120,80,40,.014) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120,80,40,.008) 0 1px, transparent 1px 5px),
    linear-gradient(180deg, #f9f1dc 0%, #f2e6c5 40%, #ecdcb0 100%);
  box-shadow:
    inset 0 0 100px rgba(139,90,45,.14),
    inset 0 0 0 1px rgba(139,90,45,.06);
  padding:70px 52px 90px;
  max-width:760px;
}

.book-page[data-cat="letter"]::before{
  content:"";position:absolute;left:0;right:0;top:34%;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(139,90,45,.16) 20%,rgba(139,90,45,.16) 80%,transparent 100%);
  pointer-events:none;z-index:0;
}
.book-page[data-cat="letter"]::after{
  content:"";position:absolute;left:0;right:0;top:68%;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(139,90,45,.14) 20%,rgba(139,90,45,.14) 80%,transparent 100%);
  pointer-events:none;z-index:0;
}

.book-page[data-cat="letter"] .page-header{
  border-bottom:none;padding-bottom:16px;margin-bottom:30px;
  position:relative;z-index:1;
}
.book-page[data-cat="letter"] .page-header::after{
  content:"";display:block;width:100px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent);
  margin:24px auto 0;opacity:.7;
}
.book-page[data-cat="letter"] .page-header h1{
  font-style:normal;font-weight:600;letter-spacing:-.005em;
}
.book-page[data-cat="letter"] .page-header .orn{color:var(--gold);opacity:.75}

/* Official postmark — top-left corner */
.book-page .postmark{display:none}
.book-page[data-cat="letter"] .postmark{
  display:block;
  position:absolute;
  top:52px;
  left:32px;
  width:108px;
  height:108px;
  opacity:.6;
  transform:rotate(-9deg);
  pointer-events:none;
  z-index:2;
}

/* Date — Dancing Script, top right */
.letter-date{
  display:block;
  text-align:right;
  font-family:'Dancing Script','Cormorant Garamond','Noto Serif Bengali',cursive;
  font-size:1.35rem;
  font-weight:500;
  color:#5a3d20;
  margin-bottom:32px;
  padding-bottom:12px;
  border-bottom:1px dashed rgba(139,90,45,.28);
  font-style:normal;
  opacity:.9;
  letter-spacing:.005em;
  position:relative;
  z-index:1;
}

.book-page[data-cat="letter"] .page-content{
  font-family:'Cormorant Garamond','Noto Serif Bengali',Georgia,serif;
  position:relative;z-index:1;
}
.book-page[data-cat="letter"] .page-content p{
  font-size:1.22rem;
  line-height:2.05;
  margin-bottom:1.6em;
  text-indent:0;
  color:#2a1c10;
  letter-spacing:.005em;
}

/* ===== Greeting — bilingual ===== */
.book-page[data-cat="letter"] .page-content .greeting{
  font-style:normal;
  font-weight:500;
  color:#3a2510;
  margin-bottom:1.7em;
  line-height:1.5;
  letter-spacing:.005em;
}
.book-page[data-cat="letter"] .page-content .greeting.bn{
  font-family:'Atma','Noto Serif Bengali',serif;
  font-size:1.4rem;
  font-weight:500;
}
.book-page[data-cat="letter"] .page-content .greeting.en{
  font-family:'Caveat','Dancing Script','Cormorant Garamond',cursive;
  font-size:1.8rem;
  font-weight:600;
}

/* ===== Valediction — bilingual ===== */
.book-page[data-cat="letter"] .page-content .valediction{
  font-style:normal;
  font-weight:500;
  color:#3a2510;
  margin-top:2em;
  margin-bottom:.7em;
  line-height:1.5;
}
.book-page[data-cat="letter"] .page-content .valediction.bn{
  font-family:'Atma','Noto Serif Bengali',serif;
  font-size:1.3rem;
  font-weight:500;
}
.book-page[data-cat="letter"] .page-content .valediction.en{
  font-family:'Caveat','Dancing Script','Cormorant Garamond',cursive;
  font-size:1.55rem;
  font-weight:600;
}

/* ===== Signature — bilingual, no bold synthesis ===== */
.book-page[data-cat="letter"] .page-content p.signature{
  font-style:normal;
  text-align:right;
  color:#241708;
  line-height:1.35;
  letter-spacing:.005em;
  margin-top:2.2em;
  margin-bottom:.4em;
  padding-top:1.6em;
  padding-right:1.2em;
  border-top:1px dashed rgba(139,90,45,.32);
  position:relative;
  z-index:1;
  transform:rotate(-1.6deg);
  transform-origin:right center;
  text-shadow:0.3px 0.3px 0.5px rgba(90,60,30,.12);
}
/* Bengali signature — Atma, weight 500 (no synthesis) */
.book-page[data-cat="letter"] .page-content p.signature.bn{
  font-family:'Atma','Noto Serif Bengali',serif;
  font-size:1.55rem;
  font-weight:500;
}
/* English signature — Caveat, larger */
.book-page[data-cat="letter"] .page-content p.signature.en{
  font-family:'Caveat','Dancing Script','Cormorant Garamond',cursive;
  font-size:1.9rem;
  font-weight:600;
}

/* Letter footer — hidden, no seal */
.book-page[data-cat="letter"] .page-footer{display:none}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== RESPONSIVE ===== */
@media (max-width:700px){
  .topbar{padding:10px 12px;gap:8px}
  .back{padding:8px 12px;font-size:0;letter-spacing:0;gap:0}
  .back::before{font-size:.9rem}
  .title-block{padding:0 6px}
  .title-block .t{font-size:.95rem}
  .title-block .a{font-size:.5rem;letter-spacing:.24em;margin-top:2px}
  .ib{width:32px;height:32px;font-size:.85rem}
  .stage{padding:10px}
  .frame{padding:5px}
  .frame::before{inset:9px}
  .frame::after{inset:12px}
  .corner{width:14px;height:14px;border-width:1px}
  .corner.tl{top:14px;left:14px}.corner.tr{top:14px;right:14px}.corner.bl{bottom:14px;left:14px}.corner.br{bottom:14px;right:14px}
  .sk-book{width:52px;height:70px}
  .book-page{padding:48px 22px 80px;font-size:1.05rem;line-height:1.85}
  .page-header{margin-bottom:44px;padding-bottom:30px}
  .book-page[data-cat="quote"] .quote-card{padding:22px 26px}
  .book-page[data-cat="quote"] .quote-card .qtext{font-size:1.2rem}
  .book-page[data-cat="quote"] .quote-card .qmark{font-size:2.6rem}
  .book-page[data-cat="poetry"] .page-content p{line-height:2.15}
  .book-page[data-cat="letter"]{padding:52px 24px 70px}
  .book-page[data-cat="letter"] .postmark{width:78px;height:78px;top:36px;left:18px;opacity:.5}
  .book-page[data-cat="letter"] .page-content p{font-size:1.08rem;line-height:1.95}
  .book-page[data-cat="letter"] .page-content .greeting.bn{font-size:1.25rem}
  .book-page[data-cat="letter"] .page-content .greeting.en{font-size:1.6rem}
  .book-page[data-cat="letter"] .page-content .valediction.bn{font-size:1.15rem}
  .book-page[data-cat="letter"] .page-content .valediction.en{font-size:1.4rem}
  .book-page[data-cat="letter"] .page-content p.signature.bn{font-size:1.3rem}
  .book-page[data-cat="letter"] .page-content p.signature.en{font-size:1.6rem}
  .letter-date{font-size:1.15rem}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">Library</a>
  <div class="title-block">
    <span class="t" id="t">Opening volume…</span>
    <span class="a" id="a"></span>
  </div>
  <div class="actions">
    <a class="ib" id="ext" href="#" target="_blank" rel="noopener" title="Open in new tab">↗</a>
    <button class="ib" id="fs" title="Fullscreen">⛶</button>
  </div>
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="stage">
  <div class="frame" id="frame">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="loading" id="loading">
      <div class="sk-book"></div>
      <div class="loading-msg">Opening the volume</div>
    </div>

    <div class="err" id="err">
      <div class="mark">✦</div>
      <h2>This volume is not in the archive</h2>
      <p id="errMsg">Please return to the library and choose another book.</p>
      <a href="index.html">← Back to Library</a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const params = new URLSearchParams(location.search);
const bookId = params.get('book');
const tEl=document.getElementById('t'),aEl=document.getElementById('a'),frame=document.getElementById('frame'),loading=document.getElementById('loading'),err=document.getElementById('err'),errMsg=document.getElementById('errMsg'),ext=document.getElementById('ext'),fs=document.getElementById('fs'),progressBar=document.getElementById('progressBar');

function cleanUrl(u){return (u||'').trim().replace(/^["']|["']$/g,'')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(msg){if(loading)loading.style.display='none';err.classList.add('on');if(msg)errMsg.textContent=msg}

function mountIframe(src){
  const iframe=document.createElement('iframe');
  iframe.src=src;iframe.allow='autoplay; fullscreen';iframe.setAttribute('allowfullscreen','true');iframe.setAttribute('loading','eager');
  iframe.addEventListener('load',()=>{loading.classList.add('out');setTimeout(()=>{if(loading.parentNode)loading.remove()},500)});
  frame.insertBefore(iframe,loading);ext.href=src;
}

/* =========================================================
   LANGUAGE DETECTION
   ========================================================= */
/* Bengali Unicode: U+0980–U+09FF */
function isBengali(text){
  return /[\u0980-\u09FF]/.test(String(text||''));
}
function langSuffix(text){
  return isBengali(text) ? ' bn' : ' en';
}

/* =========================================================
   LETTER PATTERNS
   ========================================================= */
const GREETING_PATTERNS = [
  /^(প্রিয়|প্রিয়তম|প্রিয়তমা|সুপ্রিয়|আদরের|ওগো|হে|Dear|My dear|Dearest|Hello|To)\b(?=\s|,|$)/i
];
const VALEDICTION_PATTERNS = [
  /^(ভালো\s*থেকো|ভালো\s*থাকো|ভাল\s*থেকো|ভালবাসা|সবটুকু\s*ভালোবাসা|আন্তরিকভাবে|তোমার\s*সুহৃদ|অনুগত|বিদায়|শুভেচ্ছা|সশ্রদ্ধ|শ্রদ্ধা|ইতি|Regards|Best|Yours|Sincerely|Love|With love|Warmly|Thanks|Farewell|Goodbye)\b/i
];
function isGreeting(t){return GREETING_PATTERNS.some(p=>p.test(String(t||'').trim()))}
function isValediction(t){return VALEDICTION_PATTERNS.some(p=>p.test(String(t||'').trim()))}

function extractDate(blocks){
  if(!blocks.length) return {date:null,rest:blocks};
  const first = blocks[0].trim();
  const m = first.match(/^(?:DATE|তারিখ|Date)\s*[:\-]\s*(.+)$/i);
  if(m) return {date:m[1].trim(), rest:blocks.slice(1)};
  if(first.length < 45 && /^[\d\-\/\s.,আ-হ০-৯ইং]+$/.test(first) && /\d/.test(first)){
    return {date:first, rest:blocks.slice(1)};
  }
  return {date:null, rest:blocks};
}

function bengaliToday(){
  const t = new Date();
  const months = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  return t.getDate() + 'ই ' + months[t.getMonth()] + ' ' + t.getFullYear();
}

/* =========================================================
   TEXT RENDERER
   ========================================================= */
function renderTextContent(raw, category){
  if(!raw) return '';
  const t = esc(raw).trim();
  if(!t) return '';
  let blocks = t.split(/\n\s*\n/);
  const cat = (category || '').toLowerCase();

  if(cat === 'letter'){
    let dateHtml = '';
    const d = extractDate(blocks);
    if(d.date){ dateHtml = '<span class="letter-date">' + d.date + '</span>'; blocks = d.rest; }
    else { dateHtml = '<span class="letter-date">' + bengaliToday() + '</span>'; }

    const total = blocks.length;
    const rendered = blocks.map((block, i) => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      if(!lines.length) return '';
      const first = lines[0];

      if(first.startsWith('# ')) return '<h2 class="h1">' + first.slice(2).trim() + '</h2>';
      if(first.startsWith('## ')) return '<h3 class="h2">' + first.slice(3).trim() + '</h3>';
      if(first.startsWith('>')){
        const q = lines.map(l => l.replace(/^>\s?/,'').trim()).join(' ');
        return '<blockquote>' + q + '</blockquote>';
      }
      if(/^([*\-_]\s*){3,}$/.test(block.trim())) return '<div class="divider">✦ ✦ ✦</div>';

      const text = lines.join(' ');
      const textBr = lines.join('<br>');
      const suffix = langSuffix(text);

      if(i === 0 && isGreeting(text)) return '<p class="greeting'+suffix+'">' + textBr + '</p>';
      if(i === total - 1 && total > 1) return '<p class="signature'+suffix+'">' + textBr + '</p>';
      if(isValediction(text)) return '<p class="valediction'+suffix+'">' + textBr + '</p>';
      return '<p>' + text + '</p>';
    }).join('');

    return dateHtml + rendered;
  }

  return blocks.map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if(!lines.length) return '';
    const first = lines[0];

    if(first.startsWith('# ')) return '<h2 class="h1">' + first.slice(2).trim() + '</h2>';
    if(first.startsWith('## ')) return '<h3 class="h2">' + first.slice(3).trim() + '</h3>';
    if(first.startsWith('>')){
      const q = lines.map(l => l.replace(/^>\s?/,'').trim()).join(' ');
      return '<blockquote>' + q + '</blockquote>';
    }
    if(/^([*\-_]\s*){3,}$/.test(block.trim())) return '<div class="divider">✦ ✦ ✦</div>';

    if(cat === 'quote'){
      const text = lines.join(' ');
      return '<div class="quote-card"><span class="qmark open">❝</span><p class="qtext">' + text + '</p><span class="qmark close">❞</span></div>';
    }
    if(cat === 'poetry' || (lines.length >= 2 && lines.every(l => l.length < 70))){
      return '<p class="poem">' + lines.join('<br>') + '</p>';
    }
    return '<p>' + lines.join(' ') + '</p>';
  }).join('');
}

/* =========================================================
   POST OFFICE STAMP
   ========================================================= */
function postmarkSvg(){
  return `
    <svg class="postmark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <path id="pmPath" d="M 60 60 m -43 0 a 43 43 0 1 1 86 0 a 43 43 0 1 1 -86 0"/>
      </defs>
      <circle cx="60" cy="60" r="55" fill="none" stroke="#8b3a2a" stroke-width="1.9" opacity="0.75"/>
      <circle cx="60" cy="60" r="48" fill="none" stroke="#8b3a2a" stroke-width="0.6" opacity="0.55"/>
      <text font-family="'IBM Plex Mono', monospace" font-size="7" font-weight="500" letter-spacing="1.5" fill="#8b3a2a" opacity="0.85">
        <textPath href="#pmPath" startOffset="0%">· EPILOGUE · POST OFFICE · EST · MMXXV ·</textPath>
      </text>
      <g transform="translate(60 60)" fill="#8b3a2a" opacity="0.85">
        <path d="M 0 -13 L 2.4 -2.4 L 13 0 L 2.4 2.4 L 0 13 L -2.4 2.4 L -13 0 L -2.4 -2.4 Z"/>
        <circle cx="0" cy="0" r="2" fill="#f2e6c5" opacity="0.6"/>
      </g>
    </svg>`;
}

function mountTextReader(book){
  const cat = (book.category||'story').toLowerCase();
  const isLetter = cat === 'letter';
  const html = renderTextContent(book.content || '', cat);
  const view = document.createElement('div');
  view.className='text-reader';
  view.innerHTML =
    '<article class="book-page" data-cat="'+cat+'">' +
      (isLetter ? postmarkSvg() : '') +
      '<header class="page-header">' +
        '<div class="orn">✦</div>' +
        '<h1>' + esc(book.title) + '</h1>' +
        (book.subtitle ? '<p class="sub">' + esc(book.subtitle) + '</p>' : '') +
        '<p class="byline">by ' + esc(book.author || 'Anonymous') + '</p>' +
        '<div class="hr"></div>' +
      '</header>' +
      '<div class="page-content">' + html + '</div>' +
      '<footer class="page-footer"><div class="orn">❦</div><p>The End</p></footer>' +
    '</article>';
  frame.insertBefore(view, loading);
  loading.classList.add('out');
  setTimeout(()=>{if(loading.parentNode)loading.remove()},500);
  attachProgress(view);
}

function attachProgress(scroller){
  if(!scroller || !progressBar) return;
  let raf = null;
  const onScroll = () => {
    if(raf) return;
    raf = requestAnimationFrame(() => {
      const h = scroller.scrollHeight - scroller.clientHeight;
      const p = h > 0 ? (scroller.scrollTop / h) * 100 : 0;
      progressBar.style.width = p + '%';
      raf = null;
    });
  };
  scroller.addEventListener('scroll', onScroll, {passive:true});
}

async function loadArchive(){
  const CFG=window.EA_CONFIG||{};
  let base=[];
  try{const r=await fetch('./books.json',{cache:'no-cache'});if(r.ok){const d=await r.json();if(Array.isArray(d))base=d}}catch(e){console.warn(e)}
  let overlay=[];
  if(CFG.BIN_ID&&CFG.MASTER_KEY&&!CFG.BIN_ID.startsWith('YOUR_')){
    try{
      const r=await fetch('https://api.jsonbin.io/v3/b/'+CFG.BIN_ID+'/latest',{headers:{'X-Master-Key':CFG.MASTER_KEY}});
      if(r.ok){const d=await r.json();const rec=d.record||d;if(Array.isArray(rec))overlay=rec}
    }catch(e){console.warn(e)}
  }
  const map=new Map();
  base.forEach(b=>map.set(b.id,b));
  overlay.forEach(b=>{if(b._deleted)map.delete(b.id);else map.set(b.id,b)});
  return Array.from(map.values()).filter(b=>!b._deleted);
}

if(!bookId){
  tEl.textContent='No volume selected';
  showError('No book was selected. Return to the library and pick a volume.');
} else {
  loadArchive().then(list=>{
    const book=(list||[]).find(b=>b.id===bookId);
    if(!book){tEl.textContent='Not found';showError('This volume does not exist in the archive.');return}
    document.title=book.title+' — The Epilogue Archive';
    tEl.textContent=book.title;
    aEl.textContent=book.author?('by '+book.author):'';
    if(book.type==='text'||book.content){mountTextReader(book)}
    else{
      const pdfUrl=cleanUrl(book.pdf);
      if(!pdfUrl){showError('This volume has no document attached.');return}
      requestAnimationFrame(()=>{requestAnimationFrame(()=>{setTimeout(()=>mountIframe(pdfUrl),80)})});
    }
  }).catch(e=>{
    console.error(e);tEl.textContent='Archive error';
    showError('The archive could not be reached. Please try again.');
  });
}

fs.addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()});
document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'⤡':'⛶'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement)location.href='index.html';if(e.key==='f'&&!e.ctrlKey&&!e.metaKey&&!e.altKey)fs.click()});
</script>
</body>
