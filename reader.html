<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading — The Epilogue Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Noto+Serif+Bengali:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0c09;
  --bg-2:#16110c;
  --paper:#f2e8d5;
  --paper-2:#e2d5b8;
  --ink:#1c1610;
  --ink-soft:#6e5f4a;
  --ink-mute:#a08c6f;
  --gold:#c9a86a;
  --gold-bright:#e4c084;
  --gold-soft:rgba(201,168,106,.4);
  --line:rgba(201,168,106,.2);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  font-family:'Cormorant Garamond','Noto Serif Bengali',Georgia,serif;
  background:var(--bg);
  color:var(--paper);
  display:flex;
  flex-direction:column;
  min-height:100vh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* Warm ambient background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    repeating-linear-gradient(90deg,
      rgba(255,220,180,.012) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0) 4px,
      rgba(0,0,0,.02) 5px),
    radial-gradient(ellipse at 50% -20%, rgba(201,168,106,.14) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 120%, rgba(139,40,40,.1) 0%, transparent 60%),
    linear-gradient(180deg, #0f0c09 0%, #17110c 50%, #0f0c09 100%);
  pointer-events:none;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%);
  pointer-events:none;
}

/* ==================== TOP BAR ==================== */
.topbar{
  flex-shrink:0;
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  gap:18px;
  padding:14px 26px;
  background:
    linear-gradient(180deg, rgba(30,22,14,.95), rgba(15,12,9,.98));
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 20px -6px rgba(0,0,0,.8);
}
.topbar::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,
    transparent,
    rgba(201,168,106,.5) 20%,
    rgba(228,192,132,.7) 50%,
    rgba(201,168,106,.5) 80%,
    transparent);
}

/* -- Back button -- */
.back{
  display:inline-flex;
  align-items:center;
  gap:9px;
  color:var(--gold-bright);
  text-decoration:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;
  letter-spacing:.32em;
  text-transform:uppercase;
  padding:9px 16px;
  border:1px solid var(--gold-soft);
  background:rgba(20,14,8,.5);
  transition:all .3s ease;
  white-space:nowrap;
  flex-shrink:0;
}
.back::before{
  content:"←";
  font-size:.85rem;
  transition:transform .3s ease;
}
.back:hover{
  background:rgba(201,168,106,.12);
  border-color:var(--gold);
  letter-spacing:.38em;
}
.back:hover::before{
  transform:translateX(-3px);
}

/* -- Title -- */
.title-block{
  flex:1;
  min-width:0;
  text-align:center;
  padding:0 12px;
}
.title-block .t{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-style:italic;
  font-weight:500;
  font-size:1.15rem;
  letter-spacing:.01em;
  color:var(--paper);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  display:block;
  text-shadow:0 0 24px rgba(201,168,106,.15);
}
.title-block .a{
  display:block;
  margin-top:3px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.58rem;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--ink-mute);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* -- Actions -- */
.actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}
.ib{
  width:36px;
  height:36px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:rgba(20,14,8,.5);
  border:1px solid var(--gold-soft);
  color:var(--gold-bright);
  cursor:pointer;
  font-family:inherit;
  font-size:.95rem;
  text-decoration:none;
  transition:all .25s ease;
  line-height:1;
}
.ib:hover{
  background:rgba(201,168,106,.15);
  border-color:var(--gold);
  color:var(--paper);
  box-shadow:0 0 20px rgba(201,168,106,.2);
}
.ib:active{transform:scale(.94)}

/* ==================== STAGE ==================== */
.stage{
  flex:1;
  min-height:0;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* -- Book frame (the "open book" surround) -- */
.frame{
  position:relative;
  width:100%;
  max-width:1250px;
  height:100%;
  background:var(--paper);
  padding:8px;
  border-radius:2px;
  box-shadow:
    /* spine shadow left */
    inset 14px 0 24px -18px rgba(0,0,0,.5),
    /* page edge right */
    inset -8px 0 16px -14px rgba(0,0,0,.35),
    /* hardcover slab */
    0 1px 0 rgba(255,255,255,.5) inset,
    0 20px 44px -18px rgba(0,0,0,.85),
    0 0 0 1px rgba(201,168,106,.15),
    0 0 60px rgba(201,168,106,.08);
  animation:fadeIn .55s ease both;
}

/* Gold foil inner frame */
.frame::before{
  content:"";
  position:absolute;
  inset:14px;
  border:1px solid rgba(184,137,75,.35);
  pointer-events:none;
  z-index:2;
}
/* Second inner line */
.frame::after{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid rgba(184,137,75,.14);
  pointer-events:none;
  z-index:2;
}

/* Corner ornaments */
.corner{
  position:absolute;
  width:22px;
  height:22px;
  border:1.5px solid var(--gold);
  opacity:.55;
  pointer-events:none;
  z-index:3;
}
.corner.tl{top:22px;left:22px;border-right:none;border-bottom:none}
.corner.tr{top:22px;right:22px;border-left:none;border-bottom:none}
.corner.bl{bottom:22px;left:22px;border-right:none;border-top:none}
.corner.br{bottom:22px;right:22px;border-left:none;border-top:none}

iframe{
  width:100%;
  height:100%;
  border:none;
  background:var(--paper);
  display:block;
  position:relative;
  z-index:1;
  border-radius:1px;
}

/* ==================== LOADING ==================== */
.loading{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  background:var(--paper);
  z-index:5;
  transition:opacity .45s ease;
}
.loading.out{
  opacity:0;
  pointer-events:none;
}

.loading-mark{
  width:48px;
  height:48px;
  position:relative;
}
.loading-mark::before,
.loading-mark::after{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid var(--gold);
  border-radius:50%;
  opacity:.7;
  animation:ripple 1.8s ease-out infinite;
}
.loading-mark::after{
  animation-delay:.9s;
}
@keyframes ripple{
  0%{transform:scale(.4);opacity:.85}
  100%{transform:scale(1.4);opacity:0}
}
.loading-mark .dot{
  position:absolute;
  top:50%;left:50%;
  width:6px;height:6px;
  background:var(--gold);
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.loading-msg{
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--ink-soft);
  opacity:.85;
}

/* ==================== ERROR ==================== */
.err{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:var(--paper);
  z-index:6;
  text-align:center;
  padding:36px;
}
.err.on{display:flex}

.err .mark{
  font-size:2rem;
  color:var(--gold);
  opacity:.85;
}
.err h2{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-style:italic;
  font-weight:500;
  font-size:1.45rem;
  color:var(--ink);
  line-height:1.2;
}
.err p{
  font-size:1rem;
  font-style:italic;
  color:var(--ink-soft);
  max-width:420px;
  line-height:1.55;
}
.err a{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:11px 24px;
  border:1px solid var(--gold);
  color:var(--ink);
  text-decoration:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;
  letter-spacing:.34em;
  text-transform:uppercase;
  transition:all .28s ease;
}
.err a:hover{
  background:var(--gold);
  color:var(--paper);
  letter-spacing:.4em;
}

/* ==================== ANIMATIONS ==================== */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ==================== RESPONSIVE ==================== */
@media (max-width:700px){
  .topbar{padding:10px 12px;gap:8px}
  .back{padding:8px 12px;font-size:0;letter-spacing:0;gap:0}
  .back::before{font-size:.9rem}
  .title-block{padding:0 6px}
  .title-block .t{font-size:.95rem}
  .title-block .a{font-size:.5rem;letter-spacing:.24em;margin-top:2px}
  .ib{width:32px;height:32px;font-size:.85rem}
  .stage{padding:10px}
  .frame{padding:5px}
  .frame::before{inset:9px}
  .frame::after{inset:12px}
  .corner{width:14px;height:14px;border-width:1px}
  .corner.tl{top:14px;left:14px}
  .corner.tr{top:14px;right:14px}
  .corner.bl{bottom:14px;left:14px}
  .corner.br{bottom:14px;right:14px}
  .loading-mark{width:38px;height:38px}
  .err h2{font-size:1.2rem}
  .err p{font-size:.9rem}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">Library</a>

  <div class="title-block">
    <span class="t" id="t">Opening volume…</span>
    <span class="a" id="a"></span>
  </div>

  <div class="actions">
    <a class="ib" id="ext" href="#" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">↗</a>
    <button class="ib" id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  </div>
</div>

<div class="stage">
  <div class="frame" id="frame">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="loading" id="loading">
      <div class="loading-mark"><span class="dot"></span></div>
      <div class="loading-msg">Opening the volume</div>
    </div>

    <div class="err" id="err">
      <div class="mark">✦</div>
      <h2>This volume is not in the archive</h2>
      <p id="errMsg">Please return to the library and choose another book.</p>
      <a href="index.html">← Back to Library</a>
    </div>
  </div>
</div>

<script>
/* =========================================================
   SETUP
   ========================================================= */
const params = new URLSearchParams(location.search);
const bookId = params.get('book');

const tEl       = document.getElementById('t');
const aEl       = document.getElementById('a');
const frame     = document.getElementById('frame');
const loading   = document.getElementById('loading');
const err       = document.getElementById('err');
const errMsg    = document.getElementById('errMsg');
const ext       = document.getElementById('ext');
const fs        = document.getElementById('fs');

/* =========================================================
   HELPERS
   ========================================================= */
function cleanUrl(u){
  return (u || '').trim().replace(/^["']|["']$/g, '');
}

function showError(msg){
  if(loading) loading.style.display = 'none';
  err.classList.add('on');
  if(msg) errMsg.textContent = msg;
}

function mountIframe(src){
  const iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.allow = 'autoplay; fullscreen';
  iframe.setAttribute('allowfullscreen', 'true');
  iframe.setAttribute('loading', 'eager');

  iframe.addEventListener('load', () => {
    loading.classList.add('out');
    setTimeout(() => { if(loading.parentNode) loading.remove(); }, 500);
  });

  // Insert iframe just above loading so it appears when ready
  frame.insertBefore(iframe, loading);
  ext.href = src;
}

/* =========================================================
   LOAD BOOK
   ========================================================= */
if(!bookId){
  tEl.textContent = 'No volume selected';
  aEl.textContent = '';
  showError('No book was selected. Return to the library and pick a volume.');
} else {
  fetch('./books.json', {cache:'no-cache'})
    .then(res => res.json())
    .then(list => {
      const book = (list || []).find(b => b.id === bookId);

      if(!book){
        tEl.textContent = 'Not found';
        aEl.textContent = '';
        showError('This volume does not exist in the archive.');
        return;
      }

      // Title
      document.title = book.title + ' — The Epilogue Archive';
      tEl.textContent = book.title;
      aEl.textContent = book.author ? ('by ' + book.author) : '';

      // PDF
      const pdfUrl = cleanUrl(book.pdf);
      if(!pdfUrl){
        showError('This volume has no document attached.');
        return;
      }

      mountIframe(pdfUrl);
    })
    .catch(err => {
      console.error('Archive error:', err);
      tEl.textContent = 'Archive error';
      aEl.textContent = '';
      showError('The archive could not be reached. Please check your connection and try again.');
    });
}

/* =========================================================
   FULLSCREEN
   ========================================================= */
fs.addEventListener('click', () => {
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(() => {});
  } else {
    document.exitFullscreen?.();
  }
});

/* Sync icon when fullscreen changes */
document.addEventListener('fullscreenchange', () => {
  fs.textContent = document.fullscreenElement ? '⤡' : '⛶';
  fs.title = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
});

/* =========================================================
   KEYBOARD SHORTCUTS (bonus)
   ========================================================= */
document.addEventListener('keydown', (e) => {
  // Esc → back to library (if not in fullscreen)
  if(e.key === 'Escape' && !document.fullscreenElement){
    location.href = 'index.html';
  }
  // F → toggle fullscreen
  if(e.key === 'f' && !e.ctrlKey && !e.metaKey && !e.altKey){
    fs.click();
  }
});
</script>
</body>
</html>
