<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading — The Epilogue Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://drive.google.com" crossorigin>
<link rel="preconnect" href="https://api.jsonbin.io" crossorigin>
<link rel="dns-prefetch" href="https://drive.google.com">
<link rel="dns-prefetch" href="https://api.jsonbin.io">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Noto+Serif+Bengali:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0c09;
  --bg-2:#16110c;
  --paper:#f2e8d5;
  --paper-2:#e2d5b8;
  --ink:#1c1610;
  --ink-soft:#6e5f4a;
  --ink-mute:#a08c6f;
  --gold:#c9a86a;
  --gold-bright:#e4c084;
  --gold-soft:rgba(201,168,106,.4);
  --line:rgba(201,168,106,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Cormorant Garamond','Noto Serif Bengali',Georgia,serif;
  background:var(--bg);color:var(--paper);
  display:flex;flex-direction:column;min-height:100vh;
  overflow:hidden;-webkit-font-smoothing:antialiased;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    repeating-linear-gradient(90deg,
      rgba(255,220,180,.012) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0) 4px,
      rgba(0,0,0,.02) 5px),
    radial-gradient(ellipse at 50% -20%, rgba(201,168,106,.14) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 120%, rgba(139,40,40,.1) 0%, transparent 60%),
    linear-gradient(180deg, #0f0c09 0%, #17110c 50%, #0f0c09 100%);
  pointer-events:none;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.6) 100%);
  pointer-events:none;
}

.topbar{
  flex-shrink:0;position:relative;z-index:3;
  display:flex;align-items:center;gap:18px;
  padding:14px 26px;
  background:linear-gradient(180deg, rgba(30,22,14,.95), rgba(15,12,9,.98));
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 20px -6px rgba(0,0,0,.8);
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,106,.5) 20%,rgba(228,192,132,.7) 50%,rgba(201,168,106,.5) 80%,transparent);
}
.back{
  display:inline-flex;align-items:center;gap:9px;
  color:var(--gold-bright);text-decoration:none;
  font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.32em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--gold-soft);
  background:rgba(20,14,8,.5);transition:all .3s ease;
  white-space:nowrap;flex-shrink:0;
}
.back::before{content:"←";font-size:.85rem;transition:transform .3s ease}
.back:hover{background:rgba(201,168,106,.12);border-color:var(--gold);letter-spacing:.38em}
.back:hover::before{transform:translateX(-3px)}
.title-block{flex:1;min-width:0;text-align:center;padding:0 12px}
.title-block .t{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-style:italic;font-weight:500;font-size:1.15rem;
  letter-spacing:.01em;color:var(--paper);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:block;text-shadow:0 0 24px rgba(201,168,106,.15);
}
.title-block .a{
  display:block;margin-top:3px;
  font-family:'IBM Plex Mono',monospace;font-size:.58rem;
  letter-spacing:.32em;text-transform:uppercase;
  color:var(--ink-mute);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.actions{display:flex;gap:8px;flex-shrink:0}
.ib{
  width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(20,14,8,.5);border:1px solid var(--gold-soft);
  color:var(--gold-bright);cursor:pointer;font-family:inherit;
  font-size:.95rem;text-decoration:none;transition:all .25s ease;line-height:1;
}
.ib:hover{
  background:rgba(201,168,106,.15);border-color:var(--gold);
  color:var(--paper);box-shadow:0 0 20px rgba(201,168,106,.2);
}
.ib:active{transform:scale(.94)}

.stage{flex:1;min-height:0;padding:22px;display:flex;align-items:center;justify-content:center;position:relative}
.frame{
  position:relative;width:100%;max-width:1250px;height:100%;
  background:var(--paper);padding:8px;border-radius:2px;
  box-shadow:
    inset 14px 0 24px -18px rgba(0,0,0,.5),
    inset -8px 0 16px -14px rgba(0,0,0,.35),
    0 1px 0 rgba(255,255,255,.5) inset,
    0 20px 44px -18px rgba(0,0,0,.85),
    0 0 0 1px rgba(201,168,106,.15),
    0 0 60px rgba(201,168,106,.08);
  animation:fadeIn .55s ease both;
}
.frame::before{
  content:"";position:absolute;inset:14px;
  border:1px solid rgba(184,137,75,.35);pointer-events:none;z-index:2;
}
.frame::after{
  content:"";position:absolute;inset:18px;
  border:1px solid rgba(184,137,75,.14);pointer-events:none;z-index:2;
}
.corner{
  position:absolute;width:22px;height:22px;
  border:1.5px solid var(--gold);opacity:.55;pointer-events:none;z-index:3;
}
.corner.tl{top:22px;left:22px;border-right:none;border-bottom:none}
.corner.tr{top:22px;right:22px;border-left:none;border-bottom:none}
.corner.bl{bottom:22px;left:22px;border-right:none;border-top:none}
.corner.br{bottom:22px;right:22px;border-left:none;border-top:none}

iframe{
  width:100%;height:100%;border:none;
  background:var(--paper);display:block;
  position:relative;z-index:1;border-radius:1px;
}

.loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;background:var(--paper);z-index:5;transition:opacity .45s ease;
}
.loading.out{opacity:0;pointer-events:none}
.sk-book{
  width:64px;height:88px;
  background:linear-gradient(90deg,
    rgba(201,168,106,.08) 0%,
    rgba(201,168,106,.22) 50%,
    rgba(201,168,106,.08) 100%);
  background-size:200% 100%;
  animation:shimmer 1.3s infinite;
  border-radius:2px 4px 4px 2px;
  box-shadow:inset 6px 0 12px -6px rgba(0,0,0,.5),0 8px 20px -8px rgba(0,0,0,.4);
  position:relative;
}
.sk-book::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,168,106,.25)}
.loading-msg{
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;
  letter-spacing:.42em;text-transform:uppercase;
  color:var(--ink-soft);opacity:.85;
}

.err{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:var(--paper);z-index:6;text-align:center;padding:36px;
}
.err.on{display:flex}
.err .mark{font-size:2rem;color:var(--gold);opacity:.85}
.err h2{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-style:italic;font-weight:500;font-size:1.45rem;
  color:var(--ink);line-height:1.2;
}
.err p{
  font-size:1rem;font-style:italic;color:var(--ink-soft);
  max-width:420px;line-height:1.55;
}
.err a{
  margin-top:10px;display:inline-flex;align-items:center;gap:10px;
  padding:11px 24px;border:1px solid var(--gold);color:var(--ink);
  text-decoration:none;font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;
  transition:all .28s ease;
}
.err a:hover{background:var(--gold);color:var(--paper);letter-spacing:.4em}

/* TEXT READER */
.text-reader{
  position:absolute;inset:0;background:var(--paper);
  overflow-y:auto;z-index:1;padding:0;scroll-behavior:smooth;
}
.text-reader::-webkit-scrollbar{width:8px}
.text-reader::-webkit-scrollbar-thumb{background:rgba(184,137,75,.4);border-radius:4px}
.book-page{
  max-width:720px;margin:0 auto;
  padding:70px 42px 100px;color:var(--ink);
  font-family:'Cormorant Garamond','Noto Serif Bengali',Georgia,serif;
  font-size:1.15rem;line-height:1.85;
}
.page-header{
  text-align:center;margin-bottom:60px;
  padding-bottom:40px;border-bottom:1px solid rgba(184,137,75,.3);
}
.page-header .orn{font-size:.8rem;color:var(--gold);letter-spacing:.5em;margin-bottom:20px}
.page-header h1{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-weight:500;font-style:italic;
  font-size:clamp(2rem,5vw,3rem);line-height:1.15;
  color:var(--ink);letter-spacing:-.005em;margin-bottom:14px;
}
.page-header .sub{
  font-style:italic;font-weight:300;font-size:1rem;
  color:var(--ink-soft);margin-bottom:16px;letter-spacing:.02em;
}
.page-header .byline{
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;
  letter-spacing:.32em;text-transform:uppercase;color:var(--gold);
}
.page-header .hr{width:60px;height:1px;background:var(--gold);margin:26px auto 0;opacity:.6}
.page-content p{
  margin-bottom:1.35em;text-align:justify;hyphens:auto;text-indent:1.5em;
}
.page-content p:first-of-type{text-indent:0}
.page-content p:first-of-type::first-letter{
  font-family:'Cormorant Garamond',serif;font-size:3.4em;
  font-weight:600;float:left;line-height:.85;
  margin:.08em .12em 0 0;color:var(--gold);
}
.page-content .h1{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-weight:600;font-style:italic;font-size:1.6rem;
  color:var(--ink);margin:2.2em 0 .8em;text-align:center;text-indent:0;
}
.page-content .h2{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-weight:600;font-size:1.2rem;color:var(--ink);
  margin:1.8em 0 .6em;text-indent:0;letter-spacing:.01em;
}
.page-content .poem{
  text-indent:0;text-align:center;font-style:italic;
  line-height:1.95;margin:1.8em 0;color:var(--ink-soft);
}
.page-content blockquote{
  margin:1.8em 0;padding:1em 1.4em;
  border-left:3px solid var(--gold);
  background:rgba(201,168,106,.06);
  font-style:italic;color:var(--ink-soft);text-indent:0;
}
.page-content .divider{
  text-align:center;color:var(--gold);
  letter-spacing:.8em;margin:2.5em 0;font-size:.75rem;opacity:.7;
}
.page-footer{
  text-align:center;margin-top:80px;padding-top:40px;
  border-top:1px solid rgba(184,137,75,.25);
}
.page-footer .orn{font-size:1rem;color:var(--gold);margin-bottom:10px}
.page-footer p{
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;
  letter-spacing:.42em;text-transform:uppercase;color:var(--gold);opacity:.7;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media (max-width:700px){
  .topbar{padding:10px 12px;gap:8px}
  .back{padding:8px 12px;font-size:0;letter-spacing:0;gap:0}
  .back::before{font-size:.9rem}
  .title-block{padding:0 6px}
  .title-block .t{font-size:.95rem}
  .title-block .a{font-size:.5rem;letter-spacing:.24em;margin-top:2px}
  .ib{width:32px;height:32px;font-size:.85rem}
  .stage{padding:10px}
  .frame{padding:5px}
  .frame::before{inset:9px}
  .frame::after{inset:12px}
  .corner{width:14px;height:14px;border-width:1px}
  .corner.tl{top:14px;left:14px}
  .corner.tr{top:14px;right:14px}
  .corner.bl{bottom:14px;left:14px}
  .corner.br{bottom:14px;right:14px}
  .sk-book{width:52px;height:70px}
  .err h2{font-size:1.2rem}
  .err p{font-size:.9rem}
  .book-page{padding:44px 22px 70px;font-size:1.05rem;line-height:1.75}
  .page-header{margin-bottom:40px;padding-bottom:28px}
  .page-content p:first-of-type::first-letter{font-size:2.8em}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">Library</a>
  <div class="title-block">
    <span class="t" id="t">Opening volume…</span>
    <span class="a" id="a"></span>
  </div>
  <div class="actions">
    <a class="ib" id="ext" href="#" target="_blank" rel="noopener" title="Open in new tab">↗</a>
    <button class="ib" id="fs" title="Fullscreen">⛶</button>
  </div>
</div>

<div class="stage">
  <div class="frame" id="frame">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="loading" id="loading">
      <div class="sk-book"></div>
      <div class="loading-msg">Opening the volume</div>
    </div>

    <div class="err" id="err">
      <div class="mark">✦</div>
      <h2>This volume is not in the archive</h2>
      <p id="errMsg">Please return to the library and choose another book.</p>
      <a href="index.html">← Back to Library</a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const params = new URLSearchParams(location.search);
const bookId = params.get('book');

const tEl = document.getElementById('t');
const aEl = document.getElementById('a');
const frame = document.getElementById('frame');
const loading = document.getElementById('loading');
const err = document.getElementById('err');
const errMsg = document.getElementById('errMsg');
const ext = document.getElementById('ext');
const fs = document.getElementById('fs');

function cleanUrl(u){return (u||'').trim().replace(/^["']|["']$/g,'')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function showError(msg){
  if(loading) loading.style.display = 'none';
  err.classList.add('on');
  if(msg) errMsg.textContent = msg;
}

function mountIframe(src){
  const iframe = document.createElement('iframe');
  iframe.src = src;
  iframe.allow = 'autoplay; fullscreen';
  iframe.setAttribute('allowfullscreen','true');
  iframe.setAttribute('loading','eager');
  iframe.addEventListener('load', () => {
    loading.classList.add('out');
    setTimeout(() => { if(loading.parentNode) loading.remove(); }, 500);
  });
  frame.insertBefore(iframe, loading);
  ext.href = src;
}

function renderTextContent(raw){
  if(!raw) return '';
  let t = esc(raw).trim();
  const blocks = t.split(/\n\s*\n/);
  return blocks.map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if(block.startsWith('# ')){
      return `<h2 class="h1">${block.slice(2).trim()}</h2>`;
    }
    if(block.startsWith('## ')){
      return `<h3 class="h2">${block.slice(3).trim()}</h3>`;
    }
    if(block.startsWith('> ')){
      const quote = lines.map(l => l.replace(/^>\s?/,'')).join(' ');
      return `<blockquote>${quote}</blockquote>`;
    }
    if(/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(block)){
      return `<div class="divider">✦ ✦ ✦</div>`;
    }
    if(lines.length > 1 && lines.every(l => l.length < 60)){
      return `<p class="poem">${lines.join('<br>')}</p>`;
    }
    return `<p>${lines.join(' ')}</p>`;
  }).join('');
}

function mountTextReader(book){
  const html = renderTextContent(book.content || '');
  const view = document.createElement('div');
  view.className = 'text-reader';
  view.innerHTML = `
    <article class="book-page">
      <header class="page-header">
        <div class="orn">✦</div>
        <h1>${esc(book.title)}</h1>
        ${book.subtitle ? `<p class="sub">${esc(book.subtitle)}</p>` : ''}
        <p class="byline">by ${esc(book.author||'Anonymous')}</p>
        <div class="hr"></div>
      </header>
      <div class="page-content">${html}</div>
      <footer class="page-footer">
        <div class="orn">❦</div>
        <p>The End</p>
      </footer>
    </article>
  `;
  frame.insertBefore(view, loading);
  loading.classList.add('out');
  setTimeout(() => { if(loading.parentNode) loading.remove(); }, 500);
}

async function loadArchive(){
  const CFG = window.EA_CONFIG || {};
  if(CFG.BIN_ID && CFG.MASTER_KEY && !CFG.BIN_ID.startsWith('YOUR_')){
    try{
      const res = await fetch('https://api.jsonbin.io/v3/b/' + CFG.BIN_ID + '/latest', {
        headers: { 'X-Master-Key': CFG.MASTER_KEY }
      });
      if(res.ok){
        const data = await res.json();
        const record = data.record || data;
        if(Array.isArray(record)) return record;
        if(record && Array.isArray(record.books)) return record.books;
      }
    }catch(e){ console.warn('JSONBin load failed', e); }
  }
  try{
    const res = await fetch('./books.json', {cache:'no-cache'});
    if(res.ok) return await res.json();
  }catch(e){ console.warn('books.json fallback failed', e); }
  return [];
}

if(!bookId){
  tEl.textContent = 'No volume selected';
  showError('No book was selected. Return to the library and pick a volume.');
} else {
  loadArchive()
    .then(list => {
      const book = (list||[]).find(b => b.id === bookId);
      if(!book){
        tEl.textContent = 'Not found';
        showError('This volume does not exist in the archive.');
        return;
      }
      document.title = book.title + ' — The Epilogue Archive';
      tEl.textContent = book.title;
      aEl.textContent = book.author ? ('by ' + book.author) : '';

      if(book.type === 'text' || book.content){
        mountTextReader(book);
      } else {
        const pdfUrl = cleanUrl(book.pdf);
        if(!pdfUrl){ showError('This volume has no document attached.'); return; }
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            setTimeout(() => mountIframe(pdfUrl), 80);
          });
        });
      }
    })
    .catch(err => {
      console.error('Archive error:', err);
      tEl.textContent = 'Archive error';
      showError('The archive could not be reached. Please try again.');
    });
}

fs.addEventListener('click', () => {
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(() => {});
  } else {
    document.exitFullscreen?.();
  }
});
document.addEventListener('fullscreenchange', () => {
  fs.textContent = document.fullscreenElement ? '⤡' : '⛶';
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && !document.fullscreenElement){
    location.href = 'index.html';
  }
  if(e.key === 'f' && !e.ctrlKey && !e.metaKey && !e.altKey){
    fs.click();
  }
});
</script>
</body>
</html>
