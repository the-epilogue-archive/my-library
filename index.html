<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Epilogue Archive — A Digital Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wood-dark: #2b1d14;
            --wood: #3d2817;
            --wood-light: #5a3a22;
            --cream: #f4e9d4;
            --cream-dim: #d8c9ab;
            --gold: #d4a24c;
            --gold-bright: #f0c674;
            --amber: #ffb86b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Serif Bengali', serif;
            color: var(--cream);
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(212, 162, 76, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(122, 46, 46, 0.15) 0%, transparent 60%),
                linear-gradient(180deg, #1a0f08 0%, #241610 40%, #1a0f08 100%);
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,220,170,0.012) 0px, transparent 2px, transparent 4px),
                repeating-linear-gradient(90deg, rgba(255,220,170,0.012) 0px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        /* ====== HEADER ====== */
        header {
            position: relative;
            text-align: center;
            padding: 70px 20px 40px;
            z-index: 2;
            animation: fadeDown 1.2s ease both;
        }

        .ornament-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
            color: var(--gold);
            opacity: 0.9;
        }
        .ornament-top::before,
        .ornament-top::after {
            content: "";
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .ornament-top .diamond {
            font-size: 0.7rem;
            letter-spacing: 8px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.1rem, 5.5vw, 3.6rem);
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--gold-bright);
            margin-bottom: 14px;
            line-height: 1.15;
            animation: fadeDown 1.2s ease both, flicker 4s ease-in-out infinite 1.2s;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--cream-dim);
            font-size: 1.15rem;
            letter-spacing: 3px;
            opacity: 0.9;
        }
        .subtitle::before,
        .subtitle::after {
            content: "❧";
            margin: 0 12px;
            color: var(--gold);
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* ====== SEARCH ====== */
        .search-wrap {
            max-width: 560px;
            margin: 45px auto 30px;
            position: relative;
            z-index: 2;
            padding: 0 20px;
            animation: fadeUp 1s ease 0.2s both;
        }
        .search-wrap input {
            width: 100%;
            padding: 16px 54px 16px 26px;
            background: rgba(35, 22, 14, 0.85);
            border: 1px solid rgba(212, 162, 76, 0.35);
            border-radius: 4px;
            color: var(--cream);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.35s ease;
            box-shadow:
                inset 0 2px 8px rgba(0,0,0,0.5),
                0 0 0 1px rgba(0,0,0,0.4);
        }
        .search-wrap input::placeholder {
            color: rgba(216, 201, 171, 0.45);
            font-style: italic;
        }
        .search-wrap input:focus {
            border-color: var(--gold);
            background: rgba(45, 28, 18, 0.95);
            box-shadow:
                inset 0 2px 8px rgba(0,0,0,0.6),
                0 0 25px rgba(212, 162, 76, 0.25),
                0 0 0 1px rgba(212, 162, 76, 0.5);
        }
        .search-wrap::after {
            content: "🔎";
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.55;
            pointer-events: none;
        }

        /* ====== LIBRARY / SHELVES ====== */
        .library {
            max-width: 1240px;
            margin: 40px auto 60px;
            padding: 0 24px;
            position: relative;
            z-index: 2;
        }

        .shelf {
            position: relative;
            margin-bottom: 55px;
            animation: fadeUp 0.9s ease both;
        }

        .shelf-label {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 5px;
            color: var(--gold);
            opacity: 0.65;
            padding: 0 8px 10px;
            text-transform: uppercase;
        }

        .shelf-books {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 24px 22px 0;
            min-height: 300px;
            flex-wrap: wrap;
            background:
                linear-gradient(180deg,
                    rgba(60, 40, 24, 0.35) 0%,
                    rgba(40, 25, 15, 0.55) 70%,
                    rgba(25, 15, 8, 0.75) 100%);
            border-radius: 6px 6px 0 0;
            border: 1px solid rgba(90, 58, 34, 0.5);
            border-bottom: none;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.5);
        }

        .shelf-plank {
            height: 20px;
            background:
                linear-gradient(180deg,
                    #6b4326 0%,
                    #4a2d18 25%,
                    #2e1a0e 60%,
                    #1a0f08 100%);
            border-radius: 0 0 5px 5px;
            box-shadow:
                0 8px 20px rgba(0,0,0,0.75),
                0 2px 0 rgba(120, 80, 45, 0.35) inset,
                0 -2px 6px rgba(255, 200, 130, 0.08) inset;
            position: relative;
        }
        .shelf-plank::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 3px;
            background: linear-gradient(90deg,
                transparent,
                rgba(240, 198, 116, 0.35) 15%,
                rgba(240, 198, 116, 0.5) 50%,
                rgba(240, 198, 116, 0.35) 85%,
                transparent);
        }

        /* ====== BOOK ====== */
        .book {
            position: relative;
            flex: 0 0 auto;
            width: 68px;
            height: 260px;
            text-decoration: none;
            color: var(--cream);
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(.2,.8,.2,1), filter 0.4s ease;
            transform-origin: bottom center;
            perspective: 800px;
        }

        .book-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
        }

        .book-spine {
            position: absolute;
            inset: 0;
            border-radius: 3px 5px 5px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 22px 6px 20px;
            overflow: hidden;
            box-shadow:
                inset -6px 0 12px rgba(0,0,0,0.45),
                inset 4px 0 8px rgba(255,255,255,0.06),
                0 12px 20px -6px rgba(0,0,0,0.8),
                0 3px 0 rgba(0,0,0,0.6);
            border-left: 2px solid rgba(0,0,0,0.4);
            border-right: 1px solid rgba(255,255,255,0.06);
        }

        .book-spine::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, transparent 1px, transparent 3px),
                radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.08), transparent 60%);
            pointer-events: none;
        }

        .book-spine::after {
            content: "";
            position: absolute;
            left: 4px; right: 4px;
            top: 12px; bottom: 12px;
            border-top: 1px solid rgba(212, 162, 76, 0.55);
            border-bottom: 1px solid rgba(212, 162, 76, 0.55);
            pointer-events: none;
        }

        .book-title-spine {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-align: center;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            line-height: 1.1;
            max-height: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--gold-bright);
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            z-index: 2;
        }

        .book-author-spine {
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            letter-spacing: 1.5px;
            text-align: center;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: rgba(244, 233, 212, 0.7);
            text-transform: uppercase;
            max-height: 90px;
            overflow: hidden;
            z-index: 2;
        }

        .book-emblem {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            color: rgba(212, 162, 76, 0.55);
            z-index: 1;
        }

        .book:hover {
            transform: translateY(-14px);
            filter: brightness(1.15);
            z-index: 10;
        }
        .book:hover .book-inner {
            transform: rotateY(-12deg) translateX(4px);
        }
        .book:hover .book-spine {
            box-shadow:
                inset -6px 0 12px rgba(0,0,0,0.45),
                inset 4px 0 8px rgba(255,255,255,0.12),
                0 22px 30px -8px rgba(0,0,0,0.85),
                0 0 40px rgba(240, 198, 116, 0.35);
        }

        .book-preview {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%) translateX(-10px);
            width: 170px;
            height: 260px;
            border-radius: 3px;
            overflow: hidden;
            box-shadow:
                0 20px 40px rgba(0,0,0,0.8),
                0 0 0 1px rgba(212, 162, 76, 0.3),
                inset 0 0 30px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 20;
            background: #1a0f08;
        }
        .book-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .book:hover .book-preview {
            opacity: 1;
            transform: translateY(-50%) translateX(15px);
        }

        .book-preview::after {
            content: attr(data-title);
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 20px 12px 12px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.92));
            color: var(--gold-bright);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
        }

        .shelf-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(216, 201, 171, 0.35);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.05rem;
            padding: 60px 20px;
            letter-spacing: 2px;
            min-width: 200px;
        }

        .skeleton-book {
            flex: 0 0 auto;
            width: 68px;
            height: 260px;
            border-radius: 3px 5px 5px 3px;
            background: linear-gradient(90deg,
                rgba(50, 32, 20, 0.7) 0%,
                rgba(75, 50, 30, 0.9) 50%,
                rgba(50, 32, 20, 0.7) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            box-shadow: inset -4px 0 8px rgba(0,0,0,0.5), 0 8px 15px -4px rgba(0,0,0,0.6);
        }

        /* ====== FOOTER ====== */
        footer {
            text-align: center;
            padding: 40px 20px 60px;
            color: rgba(216, 201, 171, 0.45);
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }
        footer::before {
            content: "✦ ✦ ✦";
            display: block;
            color: rgba(212, 162, 76, 0.5);
            font-size: 0.65rem;
            letter-spacing: 8px;
            margin-bottom: 18px;
        }

        /* ====== SCROLLBAR ====== */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #140a05; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6b4326, #3d2817);
            border-radius: 8px;
            border: 2px solid #140a05;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #8a5a34, #4a2d18);
        }

        /* ====== ANIMATIONS ====== */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        @keyframes flicker {
            0%, 100% { text-shadow: 0 0 20px rgba(240, 198, 116, 0.35), 0 2px 4px rgba(0,0,0,0.8), 0 0 60px rgba(212, 162, 76, 0.25); }
            50% { text-shadow: 0 0 25px rgba(240, 198, 116, 0.5), 0 2px 4px rgba(0,0,0,0.8), 0 0 80px rgba(212, 162, 76, 0.35); }
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 900px) {
            .book-preview { display: none; }
        }
        @media (max-width: 600px) {
            header { padding: 50px 16px 30px; }
            h1 { letter-spacing: 2px; }
            .subtitle { font-size: 0.95rem; }
            .subtitle::before, .subtitle::after { margin: 0 6px; }
            .library { padding: 0 12px; }
            .shelf-books { padding: 18px 12px 0; gap: 6px; min-height: 240px; }
            .book { width: 54px; height: 210px; }
            .book-title-spine { font-size: 0.6rem; max-height: 110px; }
            .book-author-spine { font-size: 0.42rem; }
            .ornament-top::before, .ornament-top::after { width: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="ornament-top"><span class="diamond">✦ ❖ ✦</span></div>
        <h1>The Epilogue Archive</h1>
        <p class="subtitle">A Digital Library of Curated Tales</p>
    </header>

    <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search the shelves by title or author...">
    </div>

    <main class="library" id="library"></main>

    <footer>The Epilogue Archive &mdash; Est. MMXXV</footer>

    <script>
        let allBooks = [];
        const BOOKS_PER_SHELF = 12;

        const SPINE_COLORS = [
            { bg: 'linear-gradient(180deg, #7a2e2e 0%, #4a1a1a 100%)', accent: '#f0c674' },
            { bg: 'linear-gradient(180deg, #2e4a3a 0%, #1a2e24 100%)', accent: '#d4a24c' },
            { bg: 'linear-gradient(180deg, #3a2e5c 0%, #221a3a 100%)', accent: '#e0b060' },
            { bg: 'linear-gradient(180deg, #5a3a1e 0%, #2e1e10 100%)', accent: '#f0c674' },
            { bg: 'linear-gradient(180deg, #1e3a5a 0%, #0f1e33 100%)', accent: '#d4a24c' },
            { bg: 'linear-gradient(180deg, #5c3a1e 0%, #331e0e 100%)', accent: '#f0c674' },
            { bg: 'linear-gradient(180deg, #4a2e4a 0%, #2a1a2a 100%)', accent: '#e0b060' },
            { bg: 'linear-gradient(180deg, #2e3a2e 0%, #1a221a 100%)', accent: '#d4a24c' }
        ];

        function slugColor(seed) {
            let h = 0;
            for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
            return SPINE_COLORS[h % SPINE_COLORS.length];
        }

        function truncate(str, max) {
            if (!str) return '';
            return str.length > max ? str.slice(0, max - 1) + '…' : str;
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function cleanPath(p) {
            if (!p) return '';
            // Leading slash/space remove + './' normalize
            return p.trim().replace(/^\.?\//, '');
        }

        function buildShelf(books, shelfIndex) {
            const shelfNumber = shelfIndex + 1;
            const shelf = document.createElement('section');
            shelf.className = 'shelf';
            shelf.style.animationDelay = (shelfIndex * 0.1) + 's';

            const label = document.createElement('div');
            label.className = 'shelf-label';
            label.textContent = `Shelf ${String(shelfNumber).padStart(2, '0')} · ${books.length} volume${books.length !== 1 ? 's' : ''}`;
            shelf.appendChild(label);

            const row = document.createElement('div');
            row.className = 'shelf-books';

            books.forEach((book, i) => {
                const palette = slugColor(book.id || book.title || String(i));
                const a = document.createElement('a');
                a.href = `reader.html?book=${encodeURIComponent(book.id)}`;
                a.className = 'book';
                a.title = `${book.title} — ${book.author}`;

                const titleShort = truncate(book.title, 34);
                const authorShort = truncate(book.author, 22);
                const coverPath = cleanPath(book.cover);

                a.innerHTML = `
                    <div class="book-inner">
                        <div class="book-spine" style="background: ${palette.bg};">
                            <div class="book-title-spine" style="color: ${palette.accent};">${escapeHtml(titleShort)}</div>
                            <div class="book-emblem">❧</div>
                            <div class="book-author-spine">${escapeHtml(authorShort)}</div>
                        </div>
                    </div>
                    <div class="book-preview" data-title="${escapeHtml(truncate(book.title, 40))}">
                        <img src="./${coverPath}" alt="${escapeHtml(book.title)}" loading="lazy"
                             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22><rect fill=%22%231a0f08%22 width=%22200%22 height=%22300%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23d4a24c%22 font-family=%22serif%22 font-size=%2214%22 text-anchor=%22middle%22>No Cover</text></svg>';">
                    </div>
                `;
                row.appendChild(a);
            });

            shelf.appendChild(row);
            const plank = document.createElement('div');
            plank.className = 'shelf-plank';
            shelf.appendChild(plank);
            return shelf;
        }

        function renderLibrary(books) {
            const library = document.getElementById('library');
            library.innerHTML = '';

            if (!books.length) {
                const shelf = document.createElement('section');
                shelf.className = 'shelf';
                shelf.innerHTML = `
                    <div class="shelf-label">Shelf 00 · 0 volumes</div>
                    <div class="shelf-books">
                        <div class="shelf-empty" style="width:100%;">— the library is silent —</div>
                    </div>
                    <div class="shelf-plank"></div>`;
                library.appendChild(shelf);
                return;
            }

            for (let i = 0; i < books.length; i += BOOKS_PER_SHELF) {
                const chunk = books.slice(i, i + BOOKS_PER_SHELF);
                library.appendChild(buildShelf(chunk, Math.floor(i / BOOKS_PER_SHELF)));
            }
        }

        function showSkeleton() {
            const library = document.getElementById('library');
            library.innerHTML = '';
            const shelf = document.createElement('section');
            shelf.className = 'shelf';
            shelf.innerHTML = `<div class="shelf-label">Opening the library…</div>`;
            const row = document.createElement('div');
            row.className = 'shelf-books';
            for (let i = 0; i < 8; i++) {
                const sk = document.createElement('div');
                sk.className = 'skeleton-book';
                row.appendChild(sk);
            }
            shelf.appendChild(row);
            const plank = document.createElement('div');
            plank.className = 'shelf-plank';
            shelf.appendChild(plank);
            library.appendChild(shelf);
        }

        showSkeleton();

        fetch('./books.json')
            .then(res => res.json())
            .then(books => {
                allBooks = Array.isArray(books) ? books : [];
                renderLibrary(allBooks);

                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    const q = e.target.value.toLowerCase().trim();
                    if (!q) { renderLibrary(allBooks); return; }
                    const filtered = allBooks.filter(b =>
                        (b.title || '').toLowerCase().includes(q) ||
                        (b.author || '').toLowerCase().includes(q) ||
                        (b.subtitle || '').toLowerCase().includes(q)
                    );
                    renderLibrary(filtered);
                });
            })
            .catch(err => {
                console.error("Error loading books:", err);
                document.getElementById('library').innerHTML = `
                    <section class="shelf">
                        <div class="shelf-label">Shelf — Error</div>
                        <div class="shelf-books">
                            <div class="shelf-empty" style="width:100%;">⚠️ &nbsp; Could not open the archive. Please try again.</div>
                        </div>
                        <div class="shelf-plank"></div>
                    </section>`;
            });
    </script>
</body>
</html>
