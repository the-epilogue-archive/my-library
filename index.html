<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Epilogue Archive — A Collector's Library</title>
<meta name="description" content="A quiet collection of tales, poetry & forgotten letters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Noto+Serif+Bengali:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0c09;
  --bg-2:#16110c;
  --paper:#f2e8d5;
  --paper-2:#e2d5b8;
  --ink:#1c1610;
  --ink-soft:#6e5f4a;
  --ink-mute:#a08c6f;
  --gold:#c9a86a;
  --gold-bright:#e4c084;
  --gold-soft:rgba(201,168,106,.4);
  --line:rgba(201,168,106,.2);
  --cream:#f7edd8;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:'Cormorant Garamond','Noto Serif Bengali',Georgia,serif;
  background:var(--bg);
  color:var(--paper);
  min-height:100vh;
  padding:80px 28px 90px;
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Warm wood texture + light from above */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    repeating-linear-gradient(90deg,
      rgba(255,220,180,.012) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0) 4px,
      rgba(0,0,0,.02) 5px),
    radial-gradient(ellipse at 50% -20%, rgba(201,168,106,.18) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 120%, rgba(139,40,40,.12) 0%, transparent 60%),
    linear-gradient(180deg, #0f0c09 0%, #17110c 50%, #0f0c09 100%);
  pointer-events:none;
}

/* Vignette */
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.65) 100%);
  pointer-events:none;
}

/* ==================== HEADER ==================== */
.masthead{
  max-width:800px;
  margin:0 auto 60px;
  text-align:center;
  animation:fadeUp .7s ease both;
}

.monogram{
  width:58px;
  height:58px;
  margin:0 auto 22px;
  border:1px solid var(--gold-soft);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:.95rem;
  font-style:italic;
  letter-spacing:.06em;
  color:var(--gold-bright);
  position:relative;
}
.monogram::before{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(201,168,106,.2);
  border-radius:50%;
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;
  letter-spacing:.44em;
  text-transform:uppercase;
  color:var(--ink-mute);
  margin-bottom:20px;
}
.eyebrow::before,
.eyebrow::after{
  content:"";
  display:inline-block;
  width:36px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);
  vertical-align:middle;
  margin:0 14px;
}

h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;
  font-size:clamp(2.6rem,6vw,4.6rem);
  line-height:1;
  letter-spacing:-.015em;
  color:var(--paper);
  margin-bottom:18px;
  text-shadow:0 0 60px rgba(201,168,106,.12);
}
h1 em{
  font-style:italic;
  font-weight:500;
  color:var(--gold-bright);
}

.tagline{
  font-size:1.05rem;
  font-style:italic;
  font-weight:300;
  color:var(--ink-mute);
  letter-spacing:.02em;
}

.flourish{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:28px;
  color:var(--gold-soft);
}
.flourish::before,
.flourish::after{
  content:"";
  width:70px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);
}
.flourish span{
  font-size:.6rem;
  letter-spacing:.5em;
  color:var(--gold-bright);
}

/* ==================== TOOLBAR ==================== */
.toolbar{
  max-width:1140px;
  margin:0 auto 44px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  animation:fadeUp .7s ease .1s both;
}

.search{
  flex:1 1 240px;
  position:relative;
  min-width:220px;
}
.search input{
  width:100%;
  padding:11px 38px 11px 16px;
  background:rgba(30,22,14,.6);
  border:1px solid var(--line);
  color:var(--paper);
  font-family:'Cormorant Garamond',serif;
  font-size:.98rem;
  letter-spacing:.02em;
  outline:none;
  transition:border-color .25s ease, background .25s ease;
  border-radius:1px;
}
.search input::placeholder{
  color:var(--ink-mute);
  font-style:italic;
}
.search input:focus{
  border-color:var(--gold);
  background:rgba(40,28,16,.85);
}
.search::after{
  content:"⌕";
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold-soft);
  font-size:1.05rem;
  pointer-events:none;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.pill{
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  padding:8px 14px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink-mute);
  cursor:pointer;
  transition:all .25s ease;
  border-radius:1px;
}
.pill:hover{color:var(--gold-bright);border-color:var(--gold-soft)}
.pill.on{
  color:var(--bg);
  background:var(--gold);
  border-color:var(--gold);
  font-weight:500;
}

/* ==================== FEATURED ==================== */
.featured{
  max-width:1140px;
  margin:0 auto 70px;
  animation:fadeUp .7s ease .15s both;
}
.featured-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--gold-soft);
  margin-bottom:22px;
  display:flex;
  align-items:center;
  gap:14px;
}
.featured-label::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,var(--gold-soft),transparent);
}

.featured-book{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:48px;
  align-items:center;
  text-decoration:none;
  color:inherit;
}

.featured-cover{
  perspective:1200px;
}

.featured-info{
  padding-right:20px;
}
.featured-info .num{
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;
  letter-spacing:.32em;
  color:var(--gold-soft);
  margin-bottom:16px;
}
.featured-info h2{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-weight:400;
  font-size:clamp(1.8rem,3.5vw,2.6rem);
  line-height:1.1;
  letter-spacing:-.01em;
  color:var(--paper);
  margin-bottom:14px;
  font-style:italic;
}
.featured-info .by{
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:22px;
}
.featured-info .desc{
  font-size:1.05rem;
  font-style:italic;
  font-weight:300;
  line-height:1.55;
  color:var(--ink-mute);
  max-width:520px;
  margin-bottom:28px;
}
.cta{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:11px 22px;
  background:transparent;
  border:1px solid var(--gold-soft);
  color:var(--gold-bright);
  font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;
  letter-spacing:.32em;
  text-transform:uppercase;
  transition:all .3s ease;
}
.featured-book:hover .cta{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--bg);
  letter-spacing:.38em;
}

/* ==================== SECTION ==================== */
.section-head{
  max-width:1140px;
  margin:0 auto 26px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
}
.section-head h2{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:500;
  font-size:1.35rem;
  color:var(--paper);
}
.count{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--ink-mute);
}

/* ==================== GRID ==================== */
.library{
  max-width:1140px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:44px 30px;
}

/* ==================== BOOK ==================== */
.book{
  display:block;
  text-decoration:none;
  color:inherit;
  opacity:0;
  animation:cardIn .55s ease both;
  contain:layout style paint;
}
.book-inner{
  display:flex;
  flex-direction:column;
}

/* -- The COVER -- */
.cover{
  position:relative;
  aspect-ratio:2/3;
  padding:28px 24px 26px 30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  border-radius:2px 5px 5px 2px;
  background:
    /* spine shadow (left) */
    linear-gradient(90deg,
      rgba(0,0,0,.55) 0%,
      rgba(0,0,0,.2) 3%,
      rgba(0,0,0,0) 8%),
    /* page edge (right) */
    linear-gradient(270deg,
      rgba(0,0,0,.22) 0%,
      rgba(0,0,0,.06) 2%,
      rgba(0,0,0,0) 6%),
    /* fabric weave */
    repeating-linear-gradient(45deg,
      rgba(255,255,255,.018) 0 1px,
      transparent 1px 3px),
    repeating-linear-gradient(-45deg,
      rgba(0,0,0,.022) 0 1px,
      transparent 1px 3px),
    /* base leather color */
    linear-gradient(160deg,
      var(--c-bg) 0%,
      var(--c-bg2) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 0 40px rgba(0,0,0,.28),
    0 1px 0 rgba(0,0,0,.4),
    0 16px 32px -16px rgba(0,0,0,.85),
    0 3px 8px rgba(0,0,0,.3);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),
             box-shadow .4s ease;
  transform-origin:center bottom;
  overflow:hidden;
}

/* Gold foil frame */
.cover::before{
  content:"";
  position:absolute;
  inset:11px;
  border:1px solid var(--c-accent);
  opacity:.65;
  pointer-events:none;
  border-radius:1px;
}
/* Second thin inner line */
.cover::after{
  content:"";
  position:absolute;
  inset:15px;
  border:1px solid var(--c-accent);
  opacity:.22;
  pointer-events:none;
}

/* Corner ornaments — subtle */
.cover-orn-tl,
.cover-orn-br{
  position:absolute;
  width:14px;
  height:14px;
  border:1px solid var(--c-accent);
  opacity:.55;
  pointer-events:none;
}
.cover-orn-tl{
  top:16px; left:16px;
  border-right:none;
  border-bottom:none;
}
.cover-orn-br{
  bottom:16px; right:16px;
  border-left:none;
  border-top:none;
}

.cover-top{
  z-index:2;
  font-size:.6rem;
  color:var(--c-accent);
  letter-spacing:.36em;
  opacity:.85;
  text-align:center;
  margin-top:2px;
}

.cover-title{
  z-index:2;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-weight:600;
  font-size:var(--c-size,1.05rem);
  line-height:1.14;
  letter-spacing:.005em;
  color:var(--c-text);
  text-align:center;
  text-transform:uppercase;
  padding:0 4px;
  word-break:break-word;
  hyphens:auto;
  overflow:hidden;
  text-shadow:
    0 1px 0 rgba(0,0,0,.4),
    0 0 24px rgba(0,0,0,.35);
}

.cover-bottom{
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  width:100%;
  margin-bottom:2px;
}

.cover-divider{
  width:32px;
  height:1px;
  background:var(--c-accent);
  opacity:.75;
}

.cover-author{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:500;
  font-size:.76rem;
  letter-spacing:.02em;
  color:var(--c-accent);
  text-align:center;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  padding:0 4px;
  max-width:100%;
  line-height:1.15;
}

/* ==================== META (below cover) ==================== */
.meta{
  padding:16px 4px 0;
  text-align:center;
}
.meta h3{
  font-family:'Cormorant Garamond','Noto Serif Bengali',serif;
  font-weight:600;
  font-size:.98rem;
  line-height:1.25;
  color:var(--paper);
  margin-bottom:5px;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.meta .author{
  font-size:.82rem;
  font-style:italic;
  font-weight:300;
  color:var(--ink-mute);
  letter-spacing:.02em;
}
.meta .cat{
  display:inline-block;
  margin-top:10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.52rem;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--gold-soft);
  padding:2px 8px;
  border:1px solid var(--line);
}

/* ==================== HOVER ==================== */
.book:hover .cover{
  transform:translateY(-8px) rotate(-.8deg);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 0 44px rgba(0,0,0,.24),
    0 1px 0 rgba(0,0,0,.4),
    0 28px 50px -18px rgba(0,0,0,.95),
    0 0 0 1px var(--gold-soft),
    0 0 40px rgba(201,168,106,.15);
}
.book:hover .cover-title{
  text-shadow:
    0 1px 0 rgba(0,0,0,.4),
    0 0 24px rgba(228,192,132,.35);
}

/* ==================== SKELETON ==================== */
.sk{
  aspect-ratio:2/3;
  background:linear-gradient(90deg,
    rgba(201,168,106,.04) 0%,
    rgba(201,168,106,.09) 50%,
    rgba(201,168,106,.04) 100%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:2px;
}

/* ==================== EMPTY ==================== */
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
}
.empty .mark{
  font-size:1.8rem;
  color:var(--gold-soft);
  margin-bottom:18px;
}
.empty h3{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:500;
  font-size:1.5rem;
  color:var(--paper);
  margin-bottom:8px;
}
.empty p{
  font-size:1rem;
  font-style:italic;
  color:var(--ink-mute);
}

/* ==================== FOOTER ==================== */
footer{
  text-align:center;
  margin-top:100px;
  color:var(--ink-mute);
  font-family:'IBM Plex Mono',monospace;
  font-size:.58rem;
  letter-spacing:.42em;
  text-transform:uppercase;
}
footer::before{
  content:"✦ ✦ ✦";
  display:block;
  color:var(--gold-soft);
  font-size:.7rem;
  letter-spacing:.7em;
  margin-bottom:20px;
}

/* ==================== SCROLLBAR ==================== */
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#0a0806}
::-webkit-scrollbar-thumb{background:rgba(201,168,106,.18)}
::-webkit-scrollbar-thumb:hover{background:rgba(201,168,106,.32)}

/* ==================== ANIMATIONS ==================== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes cardIn{to{opacity:1}}
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

/* ==================== RESPONSIVE ==================== */
@media (max-width:880px){
  .featured-book{
    grid-template-columns:1fr;
    gap:28px;
  }
  .featured-cover{
    max-width:220px;
    margin:0 auto;
  }
  .featured-info{text-align:center;padding-right:0}
  .featured-info .desc{margin-left:auto;margin-right:auto}
}

@media (max-width:600px){
  body{padding:52px 16px 60px}
  .masthead{margin-bottom:44px}
  .monogram{width:48px;height:48px;font-size:.82rem;margin-bottom:18px}
  .eyebrow{font-size:.55rem;letter-spacing:.34em;margin-bottom:16px}
  .eyebrow::before,.eyebrow::after{width:24px;margin:0 8px}
  .tagline{font-size:.92rem}
  .flourish::before,.flourish::after{width:44px}
  .toolbar{gap:14px;margin-bottom:34px}
  .search{flex-basis:100%}
  .featured{margin-bottom:50px}
  .featured-cover{max-width:180px}
  .featured-info h2{font-size:1.6rem}
  .featured-info .desc{font-size:.95rem}
  .library{
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:32px 18px;
  }
  .cover{padding:20px 14px 18px 20px}
  .cover::before{inset:8px}
  .cover::after{inset:11px}
  .cover-orn-tl{top:12px;left:12px;width:10px;height:10px}
  .cover-orn-br{bottom:12px;right:12px;width:10px;height:10px}
  .meta h3{font-size:.86rem}
  .meta .author{font-size:.74rem}
  .meta .cat{font-size:.48rem;letter-spacing:.18em;padding:2px 6px}
  .section-head h2{font-size:1.1rem}
  .count{font-size:.52rem}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="monogram">Epilogue</div>
  <div class="eyebrow">Est. MMXXV · Curated Library</div>
  <h1>The <em>Epilogue</em><br>Archive</h1>
  <p class="tagline">a quiet collection of tales, poetry &amp; forgotten letters</p>
  <div class="flourish"><span>❖</span></div>
</header>

<div class="toolbar">
  <div class="search">
    <input type="text" id="q" placeholder="Search by title, author, or whisper..." aria-label="Search" autocomplete="off">
  </div>
  <div class="filters" id="filters">
    <button class="pill on" data-cat="all">All</button>
    <button class="pill" data-cat="story">Story</button>
    <button class="pill" data-cat="poetry">Poetry</button>
  </div>
</div>

<section class="featured" id="featured" hidden>
  <div class="featured-label">Featured Volume</div>
  <a class="featured-book" id="featLink" href="#">
    <div class="featured-cover" id="featCover"></div>
    <div class="featured-info">
      <div class="num">01 · Curator's Pick</div>
      <h2 id="featTitle">—</h2>
      <div class="by" id="featAuthor">—</div>
      <p class="desc" id="featDesc">—</p>
      <span class="cta">Read the Volume →</span>
    </div>
  </a>
</section>

<div class="section-head">
  <h2>Complete Collection</h2>
  <span class="count" id="count">—</span>
</div>

<main class="library" id="library" role="list"></main>

<footer>The Epilogue Archive</footer>

<script>
/* =========================================================
   AUTO COVER PALETTES — 12 rich leather bindings
   Each: {bg1, bg2, accent, text}
   ========================================================= */
const PALETTES = [
  {bg1:'#5c1f24', bg2:'#3a1014', accent:'#e4c084', text:'#f5e6c8'}, // Oxblood
  {bg1:'#1f3a2a', bg2:'#12241a', accent:'#d4b26a', text:'#ecdfc0'}, // Forest
  {bg1:'#182a45', bg2:'#0e1a2c', accent:'#e0b878', text:'#eadfc0'}, // Navy
  {bg1:'#4a2a14', bg2:'#2c1808', accent:'#e8c878', text:'#f5ead0'}, // Chestnut
  {bg1:'#3a1d33', bg2:'#22111e', accent:'#d4a666', text:'#ecdfc0'}, // Plum
  {bg1:'#22201c', bg2:'#0f0e0c', accent:'#c9a668', text:'#e8ddb8'}, // Charcoal
  {bg1:'#1a3a3a', bg2:'#0e2222', accent:'#d4b266', text:'#ecdfc0'}, // Teal
  {bg1:'#3a2c10', bg2:'#221808', accent:'#e8c878', text:'#f5ead0'}, // Ochre
  {bg1:'#2a1d3d', bg2:'#160f24', accent:'#cfa865', text:'#ecdfc0'}, // Violet
  {bg1:'#3d1a1a', bg2:'#220d0d', accent:'#e0b060', text:'#f5e8ce'}, // Russet
  {bg1:'#0f2830', bg2:'#07161c', accent:'#cfa35c', text:'#e5d8b8'}, // Midnight
  {bg1:'#2e1f10', bg2:'#180f06', accent:'#d4b068', text:'#f0e4ca'}  // Tobacco
];

/* Deterministic hash */
function hash(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0;
  return Math.abs(h);
}
function pickPalette(book){
  return PALETTES[hash((book.title||'')+'·'+(book.author||'')) % PALETTES.length];
}
function titleSize(t){
  const n = (t||'').length;
  if(n<=5)  return '1.25rem';
  if(n<=8)  return '1.1rem';
  if(n<=12) return '.95rem';
  if(n<=18) return '.82rem';
  if(n<=25) return '.72rem';
  if(n<=32) return '.64rem';
  return '.58rem';
}
function esc(s){
  return String(s||'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* =========================================================
   BUILD COVER — pure CSS, no images
   ========================================================= */
function buildCover(book){
  const p = pickPalette(book);
  const size = titleSize(book.title);
  return `
    <div class="cover"
         style="--c-bg:${p.bg1};--c-bg2:${p.bg2};--c-accent:${p.accent};--c-text:${p.text};--c-size:${size};">
      <span class="cover-orn-tl"></span>
      <span class="cover-orn-br"></span>
      <div class="cover-top">✦</div>
      <div class="cover-title">${esc(book.title)}</div>
      <div class="cover-bottom">
        <div class="cover-divider"></div>
        <div class="cover-author">${esc(book.author||'Anonymous')}</div>
      </div>
    </div>`;
}

/* =========================================================
   BUILD BOOK CARD
   ========================================================= */
function buildCard(book, i){
  const a = document.createElement('a');
  a.href = 'reader.html?book=' + encodeURIComponent(book.id);
  a.className = 'book';
  a.setAttribute('role','listitem');
  a.setAttribute('aria-label', book.title + ' by ' + (book.author||''));
  a.style.animationDelay = (i * 0.035) + 's';
  a.innerHTML = `
    <div class="book-inner">
      ${buildCover(book)}
      <div class="meta">
        <h3>${esc(book.title)}</h3>
        <div class="author">by ${esc(book.author||'Anonymous')}</div>
        <span class="cat">${esc((book.category||'tale').toUpperCase())}</span>
      </div>
    </div>`;
  return a;
}

/* =========================================================
   RENDER
   ========================================================= */
let ALL = [];
let CUR = 'all';
let Q = '';

function applyFilters(){
  let list = ALL.slice();
  if(CUR !== 'all') list = list.filter(b => (b.category||'').toLowerCase() === CUR);
  if(Q){
    const q = Q.toLowerCase();
    list = list.filter(b =>
      (b.title||'').toLowerCase().includes(q) ||
      (b.author||'').toLowerCase().includes(q) ||
      (b.subtitle||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function render(){
  const list = applyFilters();
  const lib = document.getElementById('library');
  const countEl = document.getElementById('count');

  countEl.textContent = list.length + ' volume' + (list.length === 1 ? '' : 's');
  lib.innerHTML = '';

  if(!list.length){
    lib.innerHTML = `
      <div class="empty">
        <div class="mark">✦</div>
        <h3>No volumes match</h3>
        <p>try a different title, author, or category...</p>
      </div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach((b,i) => frag.appendChild(buildCard(b,i)));
  lib.appendChild(frag);
}

/* =========================================================
   FEATURED BOOK
   ========================================================= */
function renderFeatured(){
  if(!ALL.length) return;
  // Prefer book with featured:true, else first
  const feat = ALL.find(b => b.featured) || ALL[0];
  const wrap = document.getElementById('featured');
  const link = document.getElementById('featLink');
  const coverBox = document.getElementById('featCover');

  link.href = 'reader.html?book=' + encodeURIComponent(feat.id);
  coverBox.innerHTML = buildCover(feat);
  document.getElementById('featTitle').textContent = feat.title;
  document.getElementById('featAuthor').textContent = 'by ' + (feat.author || 'Anonymous');
  document.getElementById('featDesc').textContent = feat.subtitle || feat.description || 'A quiet volume from the archive.';

  wrap.hidden = false;
}

/* =========================================================
   SKELETON
   ========================================================= */
function skeleton(){
  const lib = document.getElementById('library');
  let html = '';
  for(let i=0;i<8;i++) html += '<div class="sk"></div>';
  lib.innerHTML = html;
  document.getElementById('count').textContent = '—';
}

/* =========================================================
   LOAD
   ========================================================= */
skeleton();

fetch('./books.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(data => {
    ALL = Array.isArray(data) ? data : [];

    const go = () => {
      renderFeatured();
      render();
    };
    if('requestIdleCallback' in window) requestIdleCallback(go, {timeout:250});
    else setTimeout(go, 0);

    /* Search (debounced) */
    const input = document.getElementById('q');
    let t;
    input.addEventListener('input', e => {
      clearTimeout(t);
      t = setTimeout(() => {
        Q = e.target.value.trim();
        render();
      }, 140);
    });

    /* Category filter */
    document.getElementById('filters').addEventListener('click', e => {
      const btn = e.target.closest('.pill');
      if(!btn) return;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
      btn.classList.add('on');
      CUR = btn.dataset.cat;
      render();
    });
  })
  .catch(err => {
    console.error('Load failed:', err);
    document.getElementById('library').innerHTML = `
      <div class="empty">
        <div class="mark">⚠</div>
        <h3>The archive is closed</h3>
        <p>please check your connection and try again</p>
      </div>`;
  });
</script>
</body>
